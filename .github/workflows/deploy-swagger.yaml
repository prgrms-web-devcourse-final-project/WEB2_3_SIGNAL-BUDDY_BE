name: Swagger 배포

on:
  push:
    branches:
      - develop

    paths:
      - 'src/test/**/*Controller*.java'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: swagger-deploy
      cancel-in-progress: true

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          submodules: true

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle 명령 실행 권한 부여
        run: chmod +x ./gradlew

      - name: Gradle 종속성 캐싱
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Gradle build
        run: ./gradlew build

      - name: Cloudflare Pages에 Swagger 배포
        uses: DongminL/swagger-to-cloudflare-pages@v1
        with:
          spec-file-path: build/api-spec/openapi3.yaml
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          project-name: signal-buddy-api-docs
          github-token: ${{ secrets.GITHUB_TOKEN }}